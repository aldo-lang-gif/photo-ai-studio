name: Build PHOTO AI STUDIO Android 0.9.3
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'native/**'
      - 'native-bridge.js'
      - 'scripts/**'
      - 'update.json'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap add android
      - name: Build and verify
        run: |
          npm run build:android
          grep -q 'versionCode 5' android/app/build.gradle
          grep -q "versionName '0.9.3'" android/app/build.gradle
          grep -q 'photo-ai-093-version-guard' www/index.html
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          gh release create v0.9.3 "$APK#PHOTO-AI-STUDIO-0.9.3.apk" --title 'PHOTO AI STUDIO 0.9.3' --notes 'Build correttiva con cache aggiornata e verifica della versione generata.'
      - uses: actions/upload-artifact@v4
        with:
          name: PHOTO-AI-STUDIO-0.9.3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
