name: Build PIXORA AI Android 0.11.0
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'native/**'
      - 'native-bridge.js'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - 'test/**'
      - 'update.json'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run test:worker
      - run: npx cap add android
      - name: Prepare permanent signing key
        env:
          PIXORA_KEYSTORE_BASE64: ${{ secrets.PIXORA_KEYSTORE_BASE64 }}
        run: |
          test -n "$PIXORA_KEYSTORE_BASE64" || (echo 'Missing GitHub secret PIXORA_KEYSTORE_BASE64' && exit 1)
          mkdir -p android/app
          echo "$PIXORA_KEYSTORE_BASE64" | base64 --decode > android/app/pixora-release.jks
          test -s android/app/pixora-release.jks
      - name: Build and verify
        env:
          PIXORA_KEYSTORE_FILE: ${{ github.workspace }}/android/app/pixora-release.jks
          PIXORA_KEYSTORE_PASSWORD: ${{ secrets.PIXORA_KEYSTORE_PASSWORD }}
          PIXORA_KEY_ALIAS: pixora
          PIXORA_KEY_PASSWORD: ${{ secrets.PIXORA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$PIXORA_KEYSTORE_PASSWORD" || (echo 'Missing GitHub secret PIXORA_KEYSTORE_PASSWORD' && exit 1)
          npm run build:android
          grep -Eq 'versionCode[[:space:]]+13' android/app/build.gradle
          grep -Eq "versionName[[:space:]]+'0.11.0'" android/app/build.gradle
          grep -q 'pixora-ai-011-client' www/index.html
          grep -q 'pixora-ai-011-editor' www/index.html
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIXORA-AI-0.11.0-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create or update GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.11.0 >/dev/null 2>&1; then
            gh release upload v0.11.0 "$APK#PIXORA-AI-0.11.0.apk" --clobber
          else
            gh release create v0.11.0 "$APK#PIXORA-AI-0.11.0.apk" --title 'PIXORA AI 0.11.0' --notes 'Prompt-based generative image editing with FLUX.2 Klein 4B; no gallery save feature added.'
          fi
