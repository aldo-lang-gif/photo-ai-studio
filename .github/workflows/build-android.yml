
name: Build PHOTO AI STUDIO Android 0.9.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'native/**'
      - 'scripts/**'
      - 'update.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Build debug APK
        run: npm run build:android

      - name: Publish APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if gh release view v0.9.1 >/dev/null 2>&1; then
            gh release upload v0.9.1 "$APK#PHOTO-AI-STUDIO-0.9.1.apk" --clobber
          else
            gh release create v0.9.1 "$APK#PHOTO-AI-STUDIO-0.9.1.apk" \
              --title "PHOTO AI STUDIO 0.9.1" \
              --notes "Versione Android 0.9.1"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-AI-STUDIO-0.9.1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
