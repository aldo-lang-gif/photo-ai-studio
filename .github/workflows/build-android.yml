name: Build PHOTO AI STUDIO Android 0.9.2
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'native/**'
      - 'native-bridge.js'
      - 'scripts/**'
      - 'update.json'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm install
      - run: npx cap add android
      - run: npm run build:android
      - name: Publish APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view v0.9.2 >/dev/null 2>&1; then
            gh release upload v0.9.2 "$APK#PHOTO-AI-STUDIO-0.9.2.apk" --clobber
          else
            gh release create v0.9.2 "$APK#PHOTO-AI-STUDIO-0.9.2.apk" --title "PHOTO AI STUDIO 0.9.2" --notes "Editor compatto e anteprime progetti."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PHOTO-AI-STUDIO-0.9.2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
