name: Build PIXORA AI Android 0.9.5
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'native/**'
      - 'native-bridge.js'
      - 'scripts/**'
      - 'update.json'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap add android
      - name: Build and verify
        run: |
          npm run build:android
          grep -Eq 'versionCode[[:space:]]*=?[[:space:]]*7' android/app/build.gradle
          grep -Eq "versionName[[:space:]]*=?[[:space:]]*'0.9.5'" android/app/build.gradle
          grep -q 'pixora-ai-095-identity-guard' www/index.html
          grep -q 'PIXORA AI 0.9.5' www/index.html
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.9.5 >/dev/null 2>&1; then
            gh release upload v0.9.5 "$APK#PIXORA-AI-0.9.5.apk" --clobber
          else
            gh release create v0.9.5 "$APK#PIXORA-AI-0.9.5.apk" --title 'PIXORA AI 0.9.5' --notes 'Logo interno e icona Android aggiornati; versione visualizzata corretta.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PIXORA-AI-0.9.5-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
